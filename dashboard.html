<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

    <!-- ===========================
         HEADER
    ============================ -->

    <header>

        <h1 id="pageTitle">Student Dashboard</h1>

    </header>

    <!-- ===========================
         NAVIGATION
    ============================ -->

    <nav>

        <ul>

            <li><a href="#">Dashboard</a></li>

            <li><a href="#">Students</a></li>

            <li><a href="#">Courses</a></li>

            <li><a href="#">About</a></li>

            <li>
                <button id="logoutBtn">
                    Logout
                </button>
            </li>

        </ul>

    </nav>

    <!-- ===========================
         MAIN CONTENT
    ============================ -->

    <main class="container">

        <!-- ===========================
             REGISTRATION FORM
        ============================ -->

        <section class="form-section">

            <h2>Student Registration Form</h2>

            <div id="formMessage"></div>

            <form id="studentForm">

                <!-- Student Name -->

                <div class="form-group">

                    <label for="name">Student Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter student name"
                    >

                </div>

                <!-- Email -->

                <div class="form-group">

                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email address"
                    >

                </div>

                <!-- Phone -->

                <div class="form-group">

                    <label for="phone">Phone Number</label>

                    <input
                        type="text"
                        id="phone"
                        placeholder="Enter phone number"
                    >

                </div>

                <!-- Age -->

                <div class="form-group">

                    <label for="age">Age</label>

                    <input
                        type="number"
                        id="age"
                        placeholder="Enter age"
                    >

                </div>

                <!-- Gender -->

                <div class="form-group">

                    <label>Gender</label>

                    <div class="gender">

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Male"
                            >
                            Male
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Female"
                            >
                            Female
                        </label>

                    </div>

                </div>

                <!-- Course -->

                <div class="form-group">

                    <label for="course">Course</label>

                    <select id="course">

                        <option value="">
                            Select Course
                        </option>

                        <option>
                            Computer Science
                        </option>

                        <option>
                            Information Technology
                        </option>

                        <option>
                            Software Engineering
                        </option>

                        <option>
                            Cyber Security
                        </option>

                        <option>
                            Data Science
                        </option>

                    </select>

                </div>

                <!-- Buttons -->

                <div class="buttons">

                    <button
                        type="button"
                        id="addStudentBtn"
                    >
                        Add Student
                    </button>

                    <button
                        type="reset"
                        id="resetFormBtn"
                    >
                        Reset Form
                    </button>

                </div>

            </form>

        </section>

        <!-- ===========================
             SEARCH SECTION
        ============================ -->

        <section class="search-section">

            <input
                type="text"
                id="search"
                placeholder="Search student by name..."
            >

        </section>

        <!-- ===========================
             STUDENT COUNTER
        ============================ -->

        <section class="counter">

            <h3>
                Total Students:
                <span id="studentCount">
                    0
                </span>
            </h3>

        </section>

        <!-- ===========================
             STUDENT TABLE
        ============================ -->

        <section class="table-section">

            <table id="studentTable">

                <thead>

                    <tr>

                        <th>Student ID</th>

                        <th>Name</th>

                        <th>Email</th>

                        <th>Phone</th>

                        <th>Age</th>

                        <th>Gender</th>

                        <th>Course</th>

                        <th>Date Registered</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="tableBody">

                    <!-- Students will appear here -->

                </tbody>

            </table>

        </section>

    </main>

    <!-- ===========================
         FOOTER
    ============================ -->

    <footer>

        &copy; 2026 Student Management System

    </footer>

    <!-- JavaScript -->

    <script src="js/dashboard.js"></script>

</body>

</html>
